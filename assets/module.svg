<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="nanoportal: one shell hosting the panels each module contributes">
  <title>nanoportal</title>
  <defs>
    <style>
      .txt { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 2; }
      .wire { stroke: #CBD5E1; stroke-width: 2; }
      .ink { fill: #0F172A; }
      .dim { fill: #64748B; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="420" fill="#FFFFFF"/>

  <rect x="400" y="26" width="160" height="34" rx="10" fill="#F1F5F9"/>
  <text class="txt" x="480" y="48" font-size="13" fill="#334155" text-anchor="middle">browser</text>
  <line class="wire" x1="480" y1="60" x2="480" y2="84"/>

  <rect x="240" y="84" width="480" height="72" rx="12" fill="#EEF2FF" stroke="#2F6BFF" stroke-width="2.5"/>
  <text class="txt ink" x="480" y="108" font-size="15" font-weight="700" text-anchor="middle">nanoportal</text>
  <text class="txt dim" x="480" y="127" font-size="10.5" text-anchor="middle">shell · workbench · plugin registry · route table</text>
  <text class="mono dim" x="480" y="145" font-size="9.5" text-anchor="middle">nginx on :80 — one origin for assets, /api/* and /plugins/*</text>

  <rect x="60" y="196" width="840" height="112" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text class="txt dim" x="80" y="218" font-size="11" font-weight="600">panels contributed by the modules</text>

  <g class="txt" text-anchor="middle">
    <rect class="card" x="80" y="230" width="150" height="58" rx="10"/><text class="ink" x="155" y="254" font-size="12" font-weight="600">nanoadmin</text><text class="dim" x="155" y="271" font-size="10">catalogue · audit</text>
    <rect class="card" x="242" y="230" width="150" height="58" rx="10"/><text class="ink" x="317" y="254" font-size="12" font-weight="600">nanoauth</text><text class="dim" x="317" y="271" font-size="10">sign-in</text>
    <rect class="card" x="404" y="230" width="150" height="58" rx="10"/><text class="ink" x="479" y="254" font-size="12" font-weight="600">nanoworkspace</text><text class="dim" x="479" y="271" font-size="10">files · git · chat</text>
    <rect class="card" x="566" y="230" width="150" height="58" rx="10"/><text class="ink" x="641" y="254" font-size="12" font-weight="600">nanoartifacts</text><text class="dim" x="641" y="271" font-size="10">library · document</text>
    <rect class="card" x="728" y="230" width="150" height="58" rx="10"/><text class="ink" x="803" y="254" font-size="12" font-weight="600">nanobus</text><text class="dim" x="803" y="271" font-size="10">voice · live ids</text>
  </g>

  <line class="wire" x1="480" y1="156" x2="480" y2="184"/>
  <line class="wire" x1="480" y1="184" x2="480" y2="196"/>

  <rect x="240" y="330" width="480" height="44" rx="10" class="card"/>
  <text class="mono" x="480" y="352" font-size="11" fill="#334155" text-anchor="middle">portal_agents · portal_agent_groups · portal_sessions</text>
  <text class="txt dim" x="480" y="367" font-size="9.5" text-anchor="middle">the projection the sidebar reads — rebuildable from the transcripts</text>
  <line class="wire" x1="480" y1="308" x2="480" y2="330"/>

  <text class="txt dim" x="480" y="400" font-size="10.5" text-anchor="middle">adding a screen does not rebuild the console: a module ships a manifest and a bundle, the shell installs it</text>
</svg>
