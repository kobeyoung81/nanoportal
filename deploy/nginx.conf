server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads (agent files, image attachments, diagnostic audio) are capped at
    # 10 MiB by the portal server and the agent hypervisor; nginx's own default
    # is 1 MB, which used to reject anything larger before it was read.
    client_max_body_size 10m;

    # Docker's embedded DNS. The upstreams below are named services, and a
    # literal name in proxy_pass is resolved exactly once, at startup: after
    # Compose recreates a dependency it gets a new IP, and nginx would keep
    # dialing the old one (502) until it was reloaded. Naming the upstream in a
    # variable makes nginx re-resolve it on this interval instead.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gateway web channel (agent chat), same-origin proxied so the browser does
    # not need a separate host:port. Matches before the generic /api/ block.
    location /api/v1/ {
        set $gateway nanogateway;
        proxy_pass http://$gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Voice dictation: the browser streams PCM frames straight to the bus, which
    # relays them to the provider's realtime transcription session. The bus
    # authenticates the connection with a single-use id minted through the
    # portal, so no token needs to travel in a header here.
    location /ws/voice {
        set $bus nanobus;
        proxy_pass http://$bus:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A dictation session is a long-lived stream of small frames.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /ws/agent/ {
        set $gateway nanogateway;
        proxy_pass http://$gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets can sit idle between frames. The default proxy_read_timeout
        # (60s) tears down idle chat connections; the gateway also sends WS
        # pings every ~45s to keep this alive. Raise both directions so the
        # connection survives long pauses between messages.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # The work library is a separate service with its own front end. nginx
    # proxies it at the same origin, which is what keeps the token handoff
    # inside postMessage instead of a cross-site cookie.
    #
    # The service serves its SPA and API from its own root, and the SPA routes
    # on the fragment, so the backend never needs to know this prefix exists;
    # the rewrite below removes it on the way in.
    # The library's own front end lives under /nanoartifacts/, not /artifacts/:
    # /artifacts is the portal's route (shell + frame), and giving both the same
    # prefix meant any trailing-slash normalisation sent a portal URL to the
    # service. One prefix, one owner.
    location /nanoartifacts/ {
        set $nanoartifacts nanoartifacts;
        # Strip the prefix with an explicit rewrite. proxy_pass with a variable
        # does not do the usual prefix replacement: a URI in the directive
        # replaces the *whole* request path with "/", so every API call would
        # land on the SPA and every POST would be a 405.
        rewrite ^/nanoartifacts/(.*)$ /$1 break;
        proxy_pass http://$nanoartifacts:8080;
        proxy_http_version 1.1;
        # A publish is up to 16 MiB of HTML; the global limit above is 10m.
        client_max_body_size 20m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Bodies stream from GridFS in 255 KiB chunks; the first byte can wait
        # on a cold chunk read.
        proxy_read_timeout 120s;
    }

    # Alpine's nginx mime.types has no .webmanifest entry; without this the
    # PWA manifest is served as application/octet-stream and Chrome rejects it.
    # Never cache it: a stale manifest (e.g. an old display_override:fullscreen)
    # otherwise keeps Chrome launching the installed app in fullscreen.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Vite emits the PDF.js worker as `.mjs`. Alpine's mime.types has no entry
    # for that extension, and a module worker refuses to start unless it is
    # served with a JavaScript content type.
    location ~* \.mjs$ {
        default_type application/javascript;
    }

    # A docx is rendered inside a sandboxed (opaque-origin) iframe, so its
    # @font-face requests are cross-origin and need an explicit allowance.
    location /fonts/ {
        default_type font/woff2;
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
